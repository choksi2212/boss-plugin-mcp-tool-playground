name: Release

# The reusable workflow publishes a GitHub Release; without contents: write
# the dispatch to the reusable workflow fails with a 403 before any plugin
# work runs.
permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  release:
    uses: risa-labs-inc/BossConsole-Releases/.github/workflows/plugin-release.yml@main
    with:
      boss_plugin_api_version: 'latest'
    secrets:
      BOSS_STORE_PLUGIN_PUBLISH_KEY: ${{ secrets.BOSS_STORE_PLUGIN_PUBLISH_KEY }}
